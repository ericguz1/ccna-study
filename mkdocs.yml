site_name: CCNA 200-301 Study Guide
site_description: Personal CCNA 200-301 study notes, built from practice-exam gaps
repo_url: https://github.com/epx/ccna-study
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Still Missing: still-missing.md
  - Domains:
      - "1. Network Fundamentals (20%)": domains/01-network-fundamentals.md
      - "2. Network Access (20%)": domains/02-network-access.md
      - "3. IP Connectivity (25%)": domains/03-ip-connectivity.md
      - "4. IP Services (10%)": domains/04-ip-services.md
      - "5. Security Fundamentals (15%)": domains/05-security-fundamentals.md
      - "6. Automation and Programmability (10%)": domains/06-automation.md
  - Exam Log: exam-log.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
